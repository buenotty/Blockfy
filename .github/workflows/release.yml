name: Build signed Play bundle

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  bundle:
    name: Build signed AAB for Google Play
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Decode upload keystore
        env:
          BLOCKFY_STORE_FILE_BASE64: ${{ secrets.BLOCKFY_STORE_FILE_BASE64 }}
        run: |
          if [ -z "$BLOCKFY_STORE_FILE_BASE64" ]; then
            echo "::error::Missing BLOCKFY_STORE_FILE_BASE64. Refusing to build an unsigned bundle."
            exit 1
          fi
          echo "$BLOCKFY_STORE_FILE_BASE64" | base64 -d > "${RUNNER_TEMP}/upload-keystore.p12"

      - name: Build release bundle
        env:
          BLOCKFY_STORE_FILE: ${{ runner.temp }}/upload-keystore.p12
          BLOCKFY_STORE_PASSWORD: ${{ secrets.BLOCKFY_STORE_PASSWORD }}
          BLOCKFY_KEY_ALIAS: ${{ secrets.BLOCKFY_KEY_ALIAS }}
          BLOCKFY_KEY_PASSWORD: ${{ secrets.BLOCKFY_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload bundle and mapping (private workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Blockfy-Release-AAB
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
