name: Build and Release Signed APK

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Signed APK and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode upload keystore
        env:
          BLOCKFY_STORE_FILE_BASE64: ${{ secrets.BLOCKFY_STORE_FILE_BASE64 }}
        run: |
          if [ -z "$BLOCKFY_STORE_FILE_BASE64" ]; then
            echo "::error::Missing BLOCKFY_STORE_FILE_BASE64. Refusing to publish an unsigned APK (Android will reject the install)."
            exit 1
          fi
          echo "$BLOCKFY_STORE_FILE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/upload-keystore.p12"

      - name: Build release APK
        env:
          BLOCKFY_STORE_FILE: ${{ github.workspace }}/upload-keystore.p12
          BLOCKFY_STORE_PASSWORD: ${{ secrets.BLOCKFY_STORE_PASSWORD }}
          BLOCKFY_KEY_ALIAS: ${{ secrets.BLOCKFY_KEY_ALIAS }}
          BLOCKFY_KEY_PASSWORD: ${{ secrets.BLOCKFY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Blockfy ${{ github.ref_name }}
          body: |
            Blockfy ${{ github.ref_name }}

            Signed build. If the file name says unsigned, do not install it.

            The package is `com.buenotty.blockfy`. Updates are meant to come from Play, so the app does not install APKs itself. A phone from Brazil starts in Portuguese. Other regions start in English (change it under the gear). Adult hosts are matched as whole names, so `jerome` is not treated as `erome`. The upload keystore is not in this repo.
          draft: false
          prerelease: false
