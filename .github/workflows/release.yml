name: Build and Release Signed APK

permissions:
  contents: write

on:
  push:
    tags: 
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Signed APK and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Blockfy ${{ github.ref_name }} — Zero Conflito com Bancos
          body: |
            ## 🛡️ Blockfy ${{ github.ref_name }}
            
            ### ✨ O que há de novo:
            - **Escudo Anti-Pornô voltou a avisar**: o alerta em tela cheia usa full-screen intent. Sem isso o Android 10+ descartava a tela em silêncio.
            - **Acessibilidade só para Reels/Shorts**: isolada em Instagram, YouTube, TikTok, Facebook e X. Sem overlay, sem Acesso ao uso e sem `REQUEST_INSTALL_PACKAGES`.
            - **Nunca lê a janela ativa**: o serviço só caminha o `event.source` do app social.
          draft: false
          prerelease: false